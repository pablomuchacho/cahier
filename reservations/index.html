<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f4c5c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Réservations" />
    <title>Réservations · Dalcroze</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside class="sidebar" id="sidebar" aria-label="Navigation">
        <div class="brand-block">
          <p class="brand">Dalcroze</p>
          <p class="brand-sub">Réservations</p>
        </div>
        <nav class="side-nav" id="side-nav">
          <button type="button" data-route="home" class="nav-item active">Accueil</button>
          <button type="button" data-route="calendar" class="nav-item">Calendrier</button>
          <button type="button" data-route="book" class="nav-item">Réserver</button>
          <button type="button" data-route="mine" class="nav-item">Mes réservations</button>
          <button type="button" data-route="profile" class="nav-item">Profil</button>
        </nav>
        <div class="sidebar-foot" id="sidebar-user"></div>
      </aside>

      <div class="shell">
        <header class="topbar">
          <button type="button" class="icon-btn sidebar-toggle" id="sidebar-toggle" aria-label="Menu">
            ☰
          </button>
          <div class="topbar-title">
            <h1 id="page-title">Accueil</h1>
            <p id="page-sub" class="muted">Institut Jaques-Dalcroze</p>
          </div>
          <button type="button" class="icon-btn" id="notif-btn" aria-label="Notifications">
            <span class="bell">🔔</span>
            <span class="badge" id="notif-badge" hidden>0</span>
          </button>
        </header>

        <main id="main" class="main" tabindex="-1"></main>
      </div>

      <nav class="bottom-nav" id="bottom-nav" aria-label="Navigation mobile">
        <button type="button" data-route="home" class="active"><span>Accueil</span></button>
        <button type="button" data-route="calendar"><span>Calendrier</span></button>
        <button type="button" data-route="book" class="fab-nav"><span>Réserver</span></button>
        <button type="button" data-route="mine"><span>Réservations</span></button>
        <button type="button" data-route="profile"><span>Profil</span></button>
      </nav>
    </div>

    <div id="overlay" class="overlay" hidden></div>
    <div id="sheet" class="sheet" hidden></div>
    <p id="toast" class="toast" role="status" hidden></p>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
